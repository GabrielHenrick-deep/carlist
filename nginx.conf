server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # O service worker e o manifest nunca podem ficar em cache,
  # senão o app não recebe atualizações.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Modelo 3D já vem comprimido (Draco): sem gzip, revalida por ETag.
  location /models/ {
    gzip off;
    default_type model/gltf-binary;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Arquivos com hash no nome podem ser cacheados "para sempre".
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
